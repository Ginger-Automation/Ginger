name: Release

on:
    workflow_dispatch:

    workflow_call:

jobs:
    MacOS:
        name: MacOS Builder
        runs-on: macOS-latest
        steps:
            -   name: Restore static site content
                uses: actions/cache@v5
                with:
                    path: ./**
                    key: cache-site-macos-${{ github.run_number }}
                    enableCrossOsArchive: true

            -   name: Create Directory for Ginger macOS Runtime
                run: |
                    mkdir Runtime

            -   name: Make Ginger macOS Runtime file executable
                run: |
                    find ./Ginger/GingerRuntime/bin/Release/net10.0/osx-x64/selenium-manager -type f -print0 | xargs -0 chmod +x

            -   uses: sibiraj-s/action-archiver@v1.2.0
                with:
                    path: './Ginger/GingerRuntime/bin/Release/net10.0/osx-x64'
                    format: tar
                    gzip: true
                    output: ./Runtime/GingerRuntime_MacOS.tar.gz

            -   uses: sibiraj-s/action-archiver@v1.2.0
                with:
                    path: './Runtime'
                    format: tar
                    gzip: true
                    output: GingerRuntime_MacOS-root.tar.gz

            -   name: Cache GingerRuntime_MacOS
                id: cache
                uses: actions/cache@v5
                with:
                    path: ./GingerRuntime_MacOS-root.tar.gz
                    key: cache-GingerRuntime_MacOS-${{ github.run_number }}
                    enableCrossOsArchive: true

    Linux:
        name: Create GingerRuntime
        runs-on: ubuntu-latest
        steps:
            -   name: Restore static site content
                uses: actions/cache@v5
                with:
                    path: ./**
                    key: cache-site-linux-${{ github.run_number }}
                    enableCrossOsArchive: true

            -   name: Create Directory for GingerRuntime
                run: |
                    mkdir Runtime

            -   name: Make Ginger Runtime file executable
                run: |
                    ls -altr
                    find ./Ginger/GingerRuntime/bin/Release/net10.0/linux-x64/selenium-manager -type f -print0 | xargs -0 chmod +x

            -   uses: sibiraj-s/action-archiver@v1.2.0
                with:
                    path: './Ginger/GingerRuntime/bin/Release/net10.0/linux-x64'
                    format: tar
                    gzip: true
                    output: ./Runtime/GingerRuntime_Linux.tar.gz

            -   name: Create Directory for GingerRuntime_Linux
                run: |
                    mv ./Documents/ReadMe.txt ./Runtime/ReadMe.txt
                    mv ./Documents/gingerInstall.sh ./Runtime/gingerInstall.sh
                    chmod +x ./Runtime/gingerInstall.sh
                    sudo apt install dos2unix
                    dos2unix -b ./Runtime/ReadMe.txt
                    dos2unix -b ./Runtime/gingerInstall.sh

            -   uses: sibiraj-s/action-archiver@v1.2.0
                with:
                    path: './Runtime'
                    format: tar
                    gzip: true
                    output: GingerRuntime_Linux-root.tar.gz

            -   name: Cache GingerRuntime_Linux
                id: cache
                uses: actions/cache@v5
                with:
                    path: ./GingerRuntime_Linux-root.tar.gz
                    key: cache-GingerRuntime_Linux-${{ github.run_number }}
                    enableCrossOsArchive: true

    Windows:
        name: Windows Installer
        runs-on: windows-latest
        env:
            RELEASE_DIR: D:\a\Ginger\Ginger\Ginger\Ginger\bin\Release\net10.0-windows10.0.17763.0
            SM_CLIENT_CERT_FILE: D:\Certificate_pkcs12.p12
        steps:
            -   name: Restore static site content
                uses: actions/cache@v5
                with:
                    path: ./**
                    key: cache-site-windows-${{ github.run_number }}
                    enableCrossOsArchive: true

            -   name: 'delete Help\Library'
                run: rmdir /s /q Ginger\Ginger\bin\Release\net10.0-windows10.0.17763.0\Help\Library
                shell: cmd

            -   name: 'add help Library'
                shell: cmd
                run: |
                    cd Ginger\Ginger\bin\Release\net10.0-windows10.0.17763.0\Help
                    git clone https://github.com/Ginger-Automation/Ginger-Web-Help.git
                    move Ginger-Web-Help\docs .
                    rename docs Library
                    rmdir /s /q Ginger-Web-Help

            -   name: Set up certificate
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: bash
                run: |
                    echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
                    ls -l /d/Certificate_pkcs12.p12

            -   name: Set variables
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                id: variables
                shell: bash
                run: |
                    echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
                    echo "KEYPAIR_NAME=gt-standard-keypair" >> "$GITHUB_OUTPUT"
                    echo "CERTIFICATE_NAME=gt-certificate" >> "$GITHUB_OUTPUT"
                    echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
                    echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
                    echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
                    echo "C:\Program Files\DigiCert\DigiCert Keylocker Tools" >> "$GITHUB_PATH"

            -   name: Code signing with Software Trust Manager
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                uses: digicert/ssm-code-signing@v0.0.2

            -   name: Setup SSM KSP on windows latest
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: cmd
                run: |
                    curl -X GET https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download -H "x-api-key:%SM_API_KEY%" -o keylockertools-windows-x64.msi
                    msiexec /i keylockertools-windows-x64.msi /quiet /qn
                    smctl windows ksp register
                    smksp_registrar.exe list
                    smctl healthcheck
                    smctl keypair ls
                    C:\Windows\System32\certutil.exe -csp "DigiCert Software Trust Manager KSP" -key -user

            -   name: Certificates Sync
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: cmd
                run: |
                    smctl windows certsync

            -   name: Locate 64-bit signtool
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: pwsh
                run: |
                    $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1 -ExpandProperty FullName
                    if (-not $signtool) { throw "64-bit signtool.exe not found in Windows Kits" }
                    Write-Host "Using $signtool"
                    "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            -   name: Create Signed Directory for dll
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: pwsh
                run: |
                    New-Item -ItemType Directory -Force -Path "$env:RELEASE_DIR\dist" | Out-Null

            -   name: Signing using Signtool dll
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: pwsh
                run: |
                    $dist = Join-Path $env:RELEASE_DIR 'dist'
                    $files = @(
                        'Ginger.dll',
                        'Ginger.ExecuterService.Contracts.dll',
                        'Ginger.External.dll',
                        'GingerAutoPilot.dll',
                        'GingerControls.dll',
                        'GingerCore.dll',
                        'GingerCoreNET.dll',
                        'GingerCoreCommon.dll',
                        'GingerExternal.dll',
                        'GingerHelper.dll',
                        'GingerHbaseFilter.dll',
                        'GingerPluginCore.dll',
                        'GingerPlugIns.dll',
                        'GingerUtils.dll',
                        'GingerWin64OsSupport.dll',
                        'Ginger.exe'
                    )

                    Write-Host "Using $env:SIGNTOOL"
                    foreach ($file in $files) {
                        $source = Join-Path $env:RELEASE_DIR $file
                        $target = Join-Path $dist $file
                        Copy-Item $source $target -Force

                        & $env:SIGNTOOL sign /sha1 b04acd961a24c99503145b62ed77ebe7e5b0da66 /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /v $target
                        if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file" }

                        Copy-Item $target $source -Force
                    }

            -   uses: nadeemjazmawe/inno-setup-action-cli@v6.0.5
                with:
                    filepath: './Ginger/GingerInstallerScriptGithub.iss'

            -   name: Create Signed Directory
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: cmd
                run: |
                    mkdir D:\a\Installers\ginger

            -   name: Signing using Signtool
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: pwsh
                run: |
                    Copy-Item D:\a\Installers\Ginger.exe D:\a\Installers\ginger\Ginger.exe -Force
                    & $env:SIGNTOOL sign /sha1 ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }} /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /v "D:\a\Installers\ginger\Ginger.exe"
                    if ($LASTEXITCODE -ne 0) { throw "Signing failed for installer" }
                    Copy-Item D:\a\Installers\ginger\Ginger.exe D:\a\Installers\Ginger.exe -Force

            -   name: Signtool verify
                if: ${{ github.event.inputs.SSLCert != 'No' }}
                shell: cmd
                run: |
                    "%SIGNTOOL%" verify /v /pa "D:\a\Installers\ginger\Ginger.exe"

            -   name: Show KeyLocker KSP log on failure
                if: ${{ failure() && github.event.inputs.SSLCert != 'No' }}
                shell: pwsh
                run: |
                    $log = Join-Path $env:USERPROFILE '.signingmanager\logs\smksp.log'
                    if (Test-Path $log) { Get-Content $log -Tail 100 } else { Write-Host "No log at $log" }

            -   name: Upload Windows Installer
                uses: actions/upload-artifact@v6
                with:
                    name: WindowsInstaller
                    path: D:/a/Installers
